<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>ChromeTabs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="bar">
    <span class="brand">ChromeTabs</span>
    <input id="url" type="text" placeholder="https://example.com" spellcheck="false">
    <label class="count">× <input id="count" type="number" min="1" value="20"></label>
    <button id="open" class="primary" title="Replace the current sessions with new ones">Open</button>
    <button id="add" title="Add this many more sessions, keeping the current ones">+ Add</button>
    <span id="error" hidden>Enter a valid web address</span>
    <div class="assist">
      <button id="draw" title="Draw a click region on the current session (F3)">✚ Region</button>
      <button id="clear-regions" title="Remove this session's regions">Clear</button>
      <button id="assist-toggle" title="Start / stop auto-click (F4)">▶ Auto-click</button>
      <label class="ms"><input id="assist-ms" type="number" min="150" max="5000" step="10" value="200"> ms</label>
      <span id="assist-status"></span>
    </div>
    <span class="spacer"></span>
    <button id="attention" class="attention-pill" hidden title="Jump to next (F2)"></button>
    <button id="through" class="through-pill" hidden title="Jump to next (F2)"></button>
    <nav id="pager" hidden>
      <button id="prev" title="Previous page (PgUp)">◀</button>
      <span id="page-label"></span>
      <span id="page-dots"></span>
      <button id="next" title="Next page (PgDn)">▶</button>
    </nav>
    <div class="seg">
      <button id="view-grid" class="on">Grid</button>
      <button id="view-tabs">Tabs</button>
    </div>
    <button id="reload-all">Reload all</button>
    <button id="close-all">Close all</button>
  </header>
  <nav id="tabstrip" hidden></nav>
  <main id="stage">
    <div id="empty">Enter an address and how many sessions, then press Open.</div>
  </main>
  <script src="../lib/url.js"></script>
  <script src="../lib/grid.js"></script>
  <script src="../lib/stagger.js"></script>
  <script src="../lib/attention.js"></script>
  <script src="../lib/clicker.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="renderer.js"></script>
  <script src="captcha.js"></script>
  <script src="assist.js"></script>
</body>
</html>
